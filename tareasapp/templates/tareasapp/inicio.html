
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Tareas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 80%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        .acciones {
            text-align: center;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .tarea {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .tarea h2 {
            margin-top: 0;
        }

        .botones {
            margin-top: 15px;
        }

        .botones a {
            margin-right: 10px;
            text-decoration: none;
        }

        #mensaje {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>📝 Mis Tareas</h1>

    <div class="acciones">
        <a href="{% url 'crear_tarea' %}" class="boton">
            ➕ Nueva tarea
        </a>
    </div>

    <p id="mensaje" role="status" aria-live="polite">
        Cargando tareas...
    </p>

    <!-- Aquí JavaScript mostrará las tareas de la API -->
    <div id="lista-tareas"></div>

</div>

<script>
    const listaTareas = document.getElementById('lista-tareas');
    const mensaje = document.getElementById('mensaje');

    async function cargarTareas() {

        // Recuperar el token guardado durante el login
        const token = sessionStorage.getItem('token');

        // Comprobar si existe un token
        if (!token) {
            mensaje.textContent = 'Debes iniciar sesión para ver tus tareas.';
            window.location.href = '/';
            return;
        }

        try {
            // Consultar la API GET enviando el token
            const respuesta = await fetch('/api/tareas/', {
                method: 'GET',
                headers: {
                    'Authorization': `Token ${token}`
                }
            });

            // Si la autenticación falla, volver al login
            if (respuesta.status === 401 || respuesta.status === 403) {
                sessionStorage.removeItem('token');
                window.location.href = '/';
                return;
            }

            if (!respuesta.ok) {
                mensaje.textContent = 'Error al consultar las tareas.';
                return;
            }

            // Convertir la respuesta JSON a un arreglo de JavaScript
            const tareas = await respuesta.json();

            // Limpiar el contenedor antes de mostrar los resultados
            listaTareas.replaceChildren();

            if (tareas.length === 0) {
                mensaje.textContent = 'No existen tareas registradas.';
                return;
            }

            mensaje.textContent = '';

            // Crear una tarjeta para cada tarea recibida
            tareas.forEach(tarea => {

                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarea';

                const titulo = document.createElement('h2');
                titulo.textContent = tarea.titulo;

                const descripcion = document.createElement('p');
                descripcion.textContent = tarea.descripcion;

                const estado = document.createElement('p');
                const etiqueta = document.createElement('strong');

                etiqueta.textContent = 'Estado: ';
                estado.appendChild(etiqueta);
                estado.append(
                    tarea.completada
                        ? 'Completada ✅'
                        : 'Pendiente ⏳'
                );

                const botones = document.createElement('div');
                botones.className = 'botones';

                const enlaceDetalle = document.createElement('a');
                enlaceDetalle.href = `/detalle/${tarea.id}/`;
                enlaceDetalle.textContent = '👁️ Ver';

                const enlaceEditar = document.createElement('a');
                enlaceEditar.href = `/editar/${tarea.id}/`;
                enlaceEditar.textContent = '✏️ Editar';

                const enlaceEliminar = document.createElement('a');
                enlaceEliminar.href = `/eliminar/${tarea.id}/`;
                enlaceEliminar.textContent = '🗑️ Eliminar';

                botones.append(
                    enlaceDetalle,
                    enlaceEditar,
                    enlaceEliminar
                );

                tarjeta.append(
                    titulo,
                    descripcion,
                    estado,
                    botones
                );

                listaTareas.appendChild(tarjeta);
            });

        } catch (error) {
            mensaje.textContent =
                'No se pudo conectar con el servidor.';
            console.error('Error al cargar tareas:', error);
        }
    }

    // Ejecutar la consulta al cargar la página
    cargarTareas();
</script>

</body>
</html>
